function cliTab(){

 $('#b').innerHTML=`<div class="card"><label for="av">Aviso para los clientes</label><textarea id="av" maxlength="140">${esc(cf.aviso)}</textarea><label for="em">Emojis de temporada</label><select id="em">${EMO.map(e=>`<option ${e==cf.emo?'selected':''}>${e}</option>`).join('')}</select>
 <label for="wa">WhatsApp (lada + número, solo dígitos)</label><input id="wa" inputmode="tel" value="${esc(cf.wa)}"><label for="wm">Mensaje de WhatsApp</label><input id="wm" maxlength="100" value="${esc(cf.waMsg)}">
 <label for="ig">Instagram (usuario sin @)</label><input id="ig" value="${esc(cf.ig)}"><label for="fb">Facebook (enlace)</label><input id="fb" value="${esc(cf.fb)}"><button id="sv2">Guardar cambios</button><p id="er" class="m" role="alert"></p></div>`;
 $('#sv2').onclick=async()=>{const n={aviso:$('#av').value.trim(),emo:$('#em').value,wa:$('#wa').value.replace(/\D/g,''),waMsg:$('#wm').value.trim(),ig:$('#ig').value.trim().replace(/^@/,''),fb:$('#fb').value.trim()},er=$('#er');
  if(n.wa&&!okWa(n.wa))return er.textContent='El WhatsApp debe tener de 10 a 15 dígitos.';
  if(n.ig&&!okIg(n.ig))return er.textContent='Usuario de Instagram no válido.';
  if(n.fb&&!okFb(n.fb))return er.textContent='El enlace debe ser de facebook.com o fb.com.';
  try{await setDoc(cfgRef,n,{merge:true});cf={...cf,...n};er.textContent='Guardado. Los clientes ya ven los cambios.'}catch(e){er.textContent='No se guardó: '+e.code}}}

onAuthStateChanged(auth,u=>{
 if(P.get('c'))return clientView(P.get('c'));
 if(P.has('alta'))return altaView();
 u&&u.email===ADMIN?admin():login()});
</script></body></html>
