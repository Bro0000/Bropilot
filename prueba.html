<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prueba de Firebase</title>
<style>
body{font:16px/1.5 system-ui,sans-serif;max-width:560px;margin:0 auto;padding:16px;background:#F3F5F8;color:#12202F}
input,button{width:100%;padding:12px;margin:6px 0;font-size:16px;border-radius:8px;border:1px solid #c9d1da;box-sizing:border-box}
button{background:#C8102E;color:#fff;border:0;font-weight:600}
ul{padding:0}li{margin:8px 0;list-style:none}.ok{color:#1B7F4B}.no{color:#C8102E;font-weight:600}
@media(prefers-color-scheme:dark){body{background:#0E1620;color:#EAF0F6}input{background:#17222F;color:#EAF0F6;border-color:#263444}.ok{color:#4CC38A}.no{color:#E5384F}}
</style>
</head>
<body>
<h1>Prueba de conexión</h1>
<p>Escribe el correo y la contraseña de administrador. No se guardan en ningún lado.</p>
<input id="em" type="email" placeholder="Correo de administrador" autocapitalize="none" autocomplete="username">
<input id="pw" type="password" placeholder="Contraseña" autocomplete="current-password">
<button id="go">Ejecutar pruebas</button>
<ul id="out"></ul>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,signInWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {getFirestore,doc,getDoc,setDoc,getDocs,deleteDoc,collection} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
const cfg={
apiKey:"AIzaSyAJ382B7G2sZjhXg2OB1fzJVioQn7sMGbk",
authDomain:"adminbr0.firebaseapp.com",
projectId:"adminbr0",
storageBucket:"adminbr0.firebasestorage.app",
messagingSenderId:"206654267138",
appId:"1:206654267138:web:bfe2c122dab56e004c2c1b"};
const app=initializeApp(cfg),auth=getAuth(app),db=getFirestore(app),out=document.getElementById("out");
const line=(ok,t)=>{const li=document.createElement("li");li.className=ok?"ok":"no";li.textContent=(ok?"✓ ":"✗ ")+t;out.appendChild(li)};
const denied=e=>e.code==="permission-denied";
async function t(n,fn){try{const r=await fn();line(r.ok,n+": "+r.msg)}catch(e){line(false,n+": "+(denied(e)?"permiso denegado (revisa las reglas y el correo escrito en ellas)":(e.code||e.message)))}}
async function login(em,pw){await signInWithEmailAndPassword(auth,em,pw)}
document.getElementById("go").onclick=async()=>{
out.innerHTML="";
const em=document.getElementById("em").value.trim().toLowerCase(),pw=document.getElementById("pw").value;
await t("1. Inicio de sesión",async()=>{try{await login(em,pw);return{ok:true,msg:"correo y contraseña válidos"}}catch(e){const m={"auth/invalid-api-key":"la apiKey está mal copiada","auth/invalid-credential":"correo o contraseña incorrectos","auth/operation-not-allowed":"falta activar Correo/contraseña en Authentication","auth/network-request-failed":"sin conexión"};return{ok:false,msg:m[e.code]||e.code||e.message}}});
if(!auth.currentUser){line(false,"Se detienen las pruebas: sin sesión no se puede continuar.");return}
await t("2. Escritura como administrador",async()=>{await setDoc(doc(db,"_prueba","ping"),{ts:Date.now()});return{ok:true,msg:"puedes escribir"}});
await t("3. Listado de clientes como administrador",async()=>{await getDocs(collection(db,"clientes"));return{ok:true,msg:"puedes leer la lista"}});
await signOut(auth);
await t("4. Sin sesión: crear cliente inválido (n=5)",async()=>{try{await setDoc(doc(db,"clientes","prueba-seguridad-00001"),{nombre:"x",tel:"1",n:5,alta:1});return{ok:false,msg:"PELIGRO: se permitió. Borra ese documento en la consola"}}catch(e){return{ok:denied(e),msg:denied(e)?"bloqueado, como se espera":(e.code||e.message)}}});
await t("5. Sin sesión: listar clientes",async()=>{try{await getDocs(collection(db,"clientes"));return{ok:false,msg:"PELIGRO: se permitió ver la lista"}}catch(e){return{ok:denied(e),msg:denied(e)?"bloqueado, como se espera":(e.code||e.message)}}});
await t("6. Sin sesión: leer la configuración pública",async()=>{await getDoc(doc(db,"config","main"));return{ok:true,msg:"lectura pública funciona"}});
await t("7. Sin sesión: inscripción válida (n=0)",async()=>{await setDoc(doc(db,"clientes","prueba-inscripcion-0001"),{nombre:"Prueba",tel:"5500000000",n:0,alta:Date.now()});return{ok:true,msg:"inscripción permitida"}});
await t("8. Limpieza de documentos de prueba",async()=>{await login(em,pw);await deleteDoc(doc(db,"clientes","prueba-inscripcion-0001"));await deleteDoc(doc(db,"_prueba","ping"));await signOut(auth);return{ok:true,msg:"listo"}});
line(true,"Fin. Mándame una captura de esta lista.");
};
</script>
</body>
</html>
